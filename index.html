<!DOCTYPE html><html><head><meta charset="UTF-8"><title id="t">Block Clicker</title>
<style>body{font-family:sans-serif;background:#222;color:#eee;text-align:center;padding:20px}#b{width:150px;height:150px;background:#4caf50;border-radius:15px;margin:20px auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;user-select:none}#b:active{transform:scale(.9)}.s{margin:15px auto;max-width:400px;background:#333;padding:10px;border-radius:10px}button{padding:6px 10px;margin:4px;border:none;border-radius:5px;background:#555;color:#fff;cursor:pointer}input{padding:5px;border-radius:5px;border:none;margin:4px}#pm,#am{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);justify-content:center;align-items:center}.x{background:#333;padding:20px;border-radius:10px;max-width:350px;width:90%}</style>
</head><body>
<h1 id="td">Block Clicker</h1>
<div id="pt">Points: 0</div>
<div id="b" onclick="ck()">Click!</div>
<div class="s" id="up"></div>
<button onclick="oP()">Admin</button>
<button onclick="rs()">Reset</button>
<div id="pm"><div class="x"><h3>PIN</h3><input type="password" id="pi" maxlength="10"><br><button onclick="cP()">OK</button><button onclick="cl('pm')">X</button><p id="pe" style="color:red"></p></div></div>
<div id="am"><div class="x"><h3>Admin</h3>
<input type="number" id="sp" placeholder="Set pts"><button onclick="aS()">Set</button><br>
<input type="number" id="ad" placeholder="Add pts"><button onclick="aA()">Add</button><br>
<input id="np" placeholder="New PIN"><button onclick="aP()">Change PIN</button><br>
<button onclick="aR()">Full Reset</button><button onclick="cl('am')">Close</button></div></div>
<script>
const NAME="Block Clicker";
let s={p:0,c:0,a:0,n:'9867'};
function L(){let v=localStorage.bc;if(v)s=Object.assign(s,JSON.parse(v))}
function S(){localStorage.bc=JSON.stringify(s)}
function cp(){return 1+s.c}
function ap(){return s.a}
function cc(){return Math.floor(10*1.5**s.c)}
function ac(){return Math.floor(50*1.6**s.a)}
function r(){
document.title=document.getElementById('td').textContent=NAME;
document.getElementById('pt').textContent='Points: '+Math.floor(s.p);
document.getElementById('up').innerHTML=`Click: ${cp()} <button onclick="bC()">Upg ($${cc()})</button><br>Auto: ${ap()}/s <button onclick="bA()">Upg ($${ac()})</button>`;
}
function ck(){s.p+=cp();r();S()}
function bC(){if(s.p>=cc()){s.p-=cc();s.c++;r();S()}}
function bA(){if(s.p>=ac()){s.p-=ac();s.a++;r();S()}}
function oP(){document.getElementById('pm').style.display='flex';document.getElementById('pi').value='';document.getElementById('pe').textContent=''}
function cl(i){document.getElementById(i).style.display='none'}
function cP(){document.getElementById('pi').value===s.n?(cl('pm'),document.getElementById('am').style.display='flex'):document.getElementById('pe').textContent='Wrong PIN'}
function aS(){let v=+document.getElementById('sp').value;if(!isNaN(v)){s.p=v;r();S()}}
function aA(){let v=+document.getElementById('ad').value;if(!isNaN(v)){s.p+=v;r();S()}}
function aP(){let v=document.getElementById('np').value.trim();if(v){s.n=v;S();alert('PIN changed')}document.getElementById('np').value=''}
function aR(){if(confirm('Reset everything?')){localStorage.removeItem('bc');s={p:0,c:0,a:0,n:'9867'};r();S();cl('am')}}
function rs(){if(confirm('Reset points/upgrades?')){s.p=0;s.c=0;s.a=0;r();S()}}
L();r();
setInterval(()=>{if(ap()>0){s.p+=ap();r();S()}},1000);
</script></body></html>
